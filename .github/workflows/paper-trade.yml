name: TVM paper trade

# Runs once per weekday ~10 minutes before the NYSE close so the regime check
# sees a near-final price. Cron is UTC: 19:50 UTC = 15:50 ET during EDT,
# 20:50 UTC = 15:50 ET during EST. Both fire; the script exits quietly when
# the market is closed or nothing needs rebalancing, so the duplicate is harmless.
on:
  schedule:
    - cron: "50 19 * * 1-5"
    - cron: "50 20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan without submitting orders"
        type: boolean
        default: true

jobs:
  rebalance:
    runs-on: ubuntu-latest
    # Requires repository secrets ALPACA_PAPER_KEY_ID / ALPACA_PAPER_SECRET_KEY.
    # Without them the job is skipped rather than failing.
    if: ${{ vars.TVM_PAPER_TRADING_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: 08-python-paper-trading-strategy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 08-python-paper-trading-strategy/requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore hold-period state
        uses: actions/cache@v4
        with:
          path: 08-python-paper-trading-strategy/state
          key: tvm-state-${{ github.run_id }}
          restore-keys: tvm-state-
      - name: Rebalance
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python paper_trade.py --dry-run
          else
            python paper_trade.py
          fi
      - name: Upload trade log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvm-trade-log-${{ github.run_id }}
          path: 08-python-paper-trading-strategy/state/
          if-no-files-found: ignore
