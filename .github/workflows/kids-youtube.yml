name: Little Lantern

# Renders nothing to YouTube. Runs the studio tests: kids-policy checks,
# a tiny episode encode, and the offline voice.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-python-kids-youtube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q tests
