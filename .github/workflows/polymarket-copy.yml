name: Polymarket copy trade

# Two paper Polymarket accounts, both simulated, no API keys.
#
#   copy   follow the wallets copying actually paid, 1% per buy
#   whale  follow up to 5 wallets whose own settled markets won >= 70%, 5% per buy
#
# Hourly tick, and a wallet re-selection every Monday 06:00 UTC. The two
# accounts run one after the other (max-parallel 1) and both write into the
# polymarket-copy-log branch, so neither clobber the other's state. Each
# sends its own daily status after 20:00 UTC. Set POLY_COPY_ENABLED to
# "false" to pause both. The careful backtest was +40% with a -56% drawdown;
# the whale account is larger and is not a claim that size is skill.
on:
  schedule:
    - cron: "12 * * * *"
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "live (simulated account) / dry-run / notify-test"
        type: choice
        options: [live, dry-run, notify-test]
        default: dry-run
      reselect:
        description: "re-pick followed wallets now (slow)"
        type: boolean
        default: false

concurrency:
  group: polymarket-copy
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.POLY_COPY_ENABLED != 'false' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: copy
            label: Polycopy
            flags: ""
            issue: "Polymarket copy trading: daily status"
          - name: whale
            label: Whale copy
            flags: "--config config.aggressive.json --state-dir state/aggressive"
            issue: "Polymarket whale copy: daily status"
    permissions:
      contents: write
      issues: write
    defaults:
      run:
        working-directory: 09-python-polymarket-copy-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 09-python-polymarket-copy-trader/requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache Polymarket history (makes weekly re-selection minutes instead of an hour)
        uses: actions/cache@v4
        with:
          path: 09-python-polymarket-copy-trader/data_cache
          # re-selection runs save a fresh copy; hourly ticks reuse the latest one
          key: polycopy-data-v1-${{ (github.event.schedule == '0 6 * * 1' || inputs.reselect == true) && github.run_id || 'tick' }}
          restore-keys: polycopy-data-v1-
      - name: Restore state from polymarket-copy-log branch
        run: |
          mkdir -p state
          if git fetch --depth=1 origin polymarket-copy-log:refs/remotes/origin/polymarket-copy-log 2>/dev/null; then
            git -C "$(git rev-parse --show-toplevel)" archive origin/polymarket-copy-log | tar -x -C state
            echo "restored $(find state -type f | tr '\n' ' ')"
          else
            echo "no polymarket-copy-log branch yet (first run)"
          fi
      - name: Tick
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
          RESELECT: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || inputs.reselect == true }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMS_EMAIL_TO: ${{ secrets.SMS_EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TVM_GITHUB_ISSUE_NOTIFY: ${{ vars.TVM_GITHUB_ISSUE_NOTIFY }}
          POLY_LABEL: ${{ matrix.label }}
          GITHUB_ISSUE_TITLE: ${{ matrix.issue }}
        run: |
          flags="${{ matrix.flags }}"
          [ "$RESELECT" = "true" ] && flags="$flags --reselect"
          python paper_trade.py --mode "$MODE" $flags
      - name: Persist state to polymarket-copy-log branch
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'live') }}
        run: |
          [ -f state/state.json ] || { echo "nothing to persist"; exit 0; }
          git config user.name "polycopy-bot"
          git config user.email "polycopy-bot@users.noreply.github.com"
          if git rev-parse --verify origin/polymarket-copy-log >/dev/null 2>&1; then
            git worktree add /tmp/log origin/polymarket-copy-log
            git -C /tmp/log checkout -B polymarket-copy-log
          else
            git worktree add --detach /tmp/log
            git -C /tmp/log checkout --orphan polymarket-copy-log
            git -C /tmp/log rm -rfq . || true
          fi
          cp -r state/. /tmp/log/
          git -C /tmp/log add -A
          git -C /tmp/log commit -qm "polycopy tick $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no changes"; exit 0; }
          git -C /tmp/log push origin polymarket-copy-log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polycopy-${{ matrix.name }}-${{ github.run_id }}
          path: 09-python-polymarket-copy-trader/state/
          if-no-files-found: ignore
