pipeline_name: retail_complex_medallion
max_retries: 2
fail_on_error_gate: true

watermarks:
  orders_cdc: "1970-01-01T00:00:00Z"
  fx_api: "1970-01-01T00:00:00Z"

dq:
  fct_orders:
    - { rule: not_null, columns: [order_line_id, order_id, customer_nk, product_nk], severity: error }
    - { rule: unique, columns: [order_line_id], severity: error }
    - { rule: positive, columns: [quantity, unit_price], severity: error }
    - { rule: accepted_values, column: order_status, values: [OPEN, SHIPPED, DELIVERED, RETURNED], severity: warn }
    - { rule: referential, column: customer_nk, ref_table: dim_customer_current, ref_column: customer_nk, severity: error }
    - { rule: referential, column: product_nk, ref_table: dim_product_current, ref_column: product_nk, severity: error }
    - { rule: row_count_min, min: 1, severity: error }
  dim_customer_scd2:
    - { rule: not_null, columns: [customer_nk, effective_from], severity: error }
    - { rule: unique, columns: [surrogate_key], severity: error }

scd2:
  customer:
    natural_key: customer_nk
    track_columns: [customer_name, region_name, country_code, segment, credit_tier]
  product:
    natural_key: product_nk
    track_columns: [product_name, product_category, brand, unit_cost, is_active]

aggregates:
  - name: gold_revenue_daily_region
    grain: [order_day, region_name, currency_code]
  - name: gold_revenue_monthly_category
    grain: [order_month, product_category]
