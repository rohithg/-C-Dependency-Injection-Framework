version: 2

models:
  - name: stg_accounts
    description: Cleaned account attributes from the CRM / billing system of record.
    columns:
      - name: account_id
        description: Surrogate business key for the tenant account.
        data_tests:
          - unique
          - not_null
      - name: account_name
        data_tests:
          - not_null
      - name: segment
        data_tests:
          - accepted_values:
              values: ['smb', 'mid_market', 'enterprise']
      - name: region
        data_tests:
          - accepted_values:
              values: ['NAMER', 'EMEA', 'APAC']
      - name: is_internal
        description: Flag for demo / internal accounts excluded from revenue metrics.

  - name: stg_plans
    description: Plan catalog with list price and tier metadata.
    columns:
      - name: plan_id
        data_tests:
          - unique
          - not_null
      - name: plan_tier
        data_tests:
          - accepted_values:
              values: ['starter', 'growth', 'professional', 'enterprise']
      - name: price_cents
        data_tests:
          - not_null

  - name: stg_subscriptions
    description: Subscription records with MRR in cents and lifecycle timestamps.
    columns:
      - name: subscription_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_accounts')
              field: account_id
      - name: plan_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_plans')
              field: plan_id
      - name: status
        data_tests:
          - accepted_values:
              values: ['active', 'churned', 'trialing', 'upgraded']
      - name: mrr_cents
        data_tests:
          - not_null

  - name: stg_usage_events
    description: Product analytics events used for activation and engagement.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_accounts')
              field: account_id
      - name: event_name
        data_tests:
          - not_null
      - name: event_at
        data_tests:
          - not_null
