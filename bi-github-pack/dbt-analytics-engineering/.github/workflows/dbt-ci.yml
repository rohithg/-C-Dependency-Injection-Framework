name: dbt CI

on:
  pull_request:
    paths:
      - 'models/**'
      - 'macros/**'
      - 'tests/**'
      - 'seeds/**'
      - 'analyses/**'
      - 'dbt_project.yml'
      - 'packages.yml'
      - '.github/workflows/dbt-ci.yml'
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}
  # Optional Snowflake secrets for full `dbt build` (see notes below)
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

jobs:
  dbt-parse-and-docs:
    name: dbt parse + docs generate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dbt (Snowflake + DuckDB)
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core>=1.7,<1.9" "dbt-snowflake>=1.7,<1.9" "dbt-duckdb>=1.7,<1.9"

      - name: Write local DuckDB profile for offline CI
        run: |
          cat > profiles.yml <<'EOF'
          saas_analytics:
            target: local
            outputs:
              local:
                type: duckdb
                path: target/saas_analytics.duckdb
                threads: 4
          EOF

      - name: Install dbt packages
        run: dbt deps --profiles-dir .

      # ------------------------------------------------------------------
      # Always-on checks (no warehouse credentials required)
      # ------------------------------------------------------------------
      - name: dbt parse
        run: dbt parse --profiles-dir . --target local

      - name: dbt docs generate
        run: dbt docs generate --profiles-dir . --target local --empty-catalog
        # --empty-catalog allows docs HTML without a live warehouse catalog query

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/index.html
            target/manifest.json
            target/catalog.json
          if-no-files-found: warn

  # ----------------------------------------------------------------------
  # Optional: full build against Snowflake when secrets are configured.
  # Enable by setting repository secrets listed in `env:` above.
  # Uncomment the job (or set `if:` to true) once credentials exist.
  # ----------------------------------------------------------------------
  # dbt-build-snowflake:
  #   name: dbt build (Snowflake)
  #   runs-on: ubuntu-latest
  #   if: ${{ secrets.SNOWFLAKE_ACCOUNT != '' }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.11'
  #     - run: pip install "dbt-core>=1.7,<1.9" "dbt-snowflake>=1.7,<1.9"
  #     - run: |
  #         cp profiles.yml.example profiles.yml
  #         dbt deps --profiles-dir .
  #         dbt seed --target ci --profiles-dir .
  #         dbt build --target ci --profiles-dir .
  #   # Notes for operators:
  #   # 1. Prefer a short-lived CI role with write access only to ANALYTICS_CI.
  #   # 2. Run `dbt build` (not only `run`) so singular + generic tests gate merges.
  #   # 3. Use `--select state:modified+` with a persisted manifest for PR slim CI.
  #   # 4. Store the CI schema under a PR-number prefix to avoid collisions.

  dbt-sqlfluff-lint:
    name: SQL lint (optional soft check)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sqlfluff
        run: pip install sqlfluff sqlfluff-templater-dbt "dbt-core>=1.7,<1.9" "dbt-duckdb>=1.7,<1.9"
      - name: Write local profile
        run: |
          cat > profiles.yml <<'EOF'
          saas_analytics:
            target: local
            outputs:
              local:
                type: duckdb
                path: target/saas_analytics.duckdb
                threads: 4
          EOF
      - run: dbt deps --profiles-dir .
      - name: Lint models
        run: |
          sqlfluff lint models macros \
            --dialect snowflake \
            --templater jinja \
            || true
